<!DOCTYPE html>
<html lang="fr" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mot de passe oublie - BusinessApp</title>
    <link rel="icon" type="image/png" sizes="32x32" href="assets/img/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="assets/img/favicon-16x16.png">
    <link rel="icon" type="image/png" sizes="192x192" href="assets/img/favicon-192x192.png">
    <link rel="apple-touch-icon" sizes="180x180" href="assets/img/apple-touch-icon.png">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="css/page-bg.css" rel="stylesheet">
    <link href="css/app-ux.css" rel="stylesheet">
    <link href="css/charts-global-theme.css" rel="stylesheet">
    <style>
      body { display: flex; align-items: center; justify-content: center; min-height: 100vh; margin: 0; }
      .auth-card { width: 100%; max-width: 430px; padding: 2rem 2.5rem 2.2rem; text-align: center; }
      input.form-control { border-radius: 12px; padding: 12px 16px; background: rgba(255,255,255,0.05); border: 1.5px solid var(--border); }
      [data-theme='dark'] input.form-control { background: rgba(0,0,0,0.2); color: white; }
      .dev-link-box {
        display: none;
        margin-top: 12px;
        padding: 10px 12px;
        border-radius: 10px;
        background: rgba(245, 158, 11, 0.12);
        border: 1px solid rgba(245, 158, 11, 0.45);
        font-size: 0.85rem;
        text-align: left;
      }
      .dev-link-box a { word-break: break-all; }
    </style>
</head>
<body class="auth-page">
    <div style="position: fixed; top: 20px; right: 20px; z-index: 1000;">
        <button class="theme-toggle" id="themeToggle" type="button">
            <span id="themeIcon"><i class="bi bi-moon-stars-fill"></i></span>
            <span id="themeLabel">Sombre</span>
        </button>
    </div>

    <div class="page-bg"><div class="bg-img"></div><div class="bg-veil"></div><div class="bg-grid"></div></div>

    <div class="auth-card card anim">
      <h2 class="fw-800 mb-2">Mot de passe oublie</h2>
      <p class="text-muted mb-4">Entrez votre email pour recevoir un lien de reinitialisation.</p>

      <form id="forgotForm" class="text-start" onsubmit="event.preventDefault(); submitForgotPassword();">
          <div class="mb-3">
              <label class="form-label small fw-700">Adresse Email</label>
              <input id="email" type="email" class="form-control" placeholder="nom@exemple.com" required>
          </div>
          <button id="submitBtn" type="submit" class="btn btn-primary w-100 py-3 fw-700">Envoyer le lien</button>
          <p id="msg" class="text-center small mt-3 mb-0"></p>
          <div id="devLinkBox" class="dev-link-box">
            <div class="fw-700 mb-1"><i class="bi bi-wrench-adjustable-circle me-1"></i>Mode local</div>
            <div class="small">SMTP non configure. Utilisez ce lien de test :</div>
            <a id="devLink" href="#"></a>
          </div>
      </form>

      <div class="mt-4 pt-3 border-top">
          <a href="index.html" class="small fw-700 text-decoration-none" style="color: var(--primary);">Retour a la connexion</a>
      </div>
    </div>

    <script src="js/theme-manager.js"></script>
    <script>
      function escapeHtml(value) {
        const div = document.createElement('div');
        div.textContent = value == null ? '' : String(value);
        return div.innerHTML;
      }

      async function submitForgotPassword() {
        const email = document.getElementById('email').value.trim();
        const msg = document.getElementById('msg');
        const btn = document.getElementById('submitBtn');
        const devBox = document.getElementById('devLinkBox');
        const devLink = document.getElementById('devLink');

        msg.style.color = '';
        msg.textContent = '';
        devBox.style.display = 'none';

        btn.disabled = true;
        btn.innerHTML = '<span class="spinner-border spinner-border-sm"></span> Envoi...';

        try {
          const res = await fetch('/api/auth/forgot-password', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ email })
          });
          const data = await res.json();

          if (!res.ok) {
            msg.style.color = '#ef4444';
            msg.innerHTML = `<i class="bi bi-x-circle-fill me-1"></i>${escapeHtml(data.error || 'Erreur serveur')}`;
            return;
          }

          msg.style.color = '#10b981';
          msg.innerHTML = `<i class="bi bi-check-circle-fill me-1"></i>${escapeHtml(data.message || 'Si un compte existe, un email a ete envoye.')}`;

          if (data.dev_reset_url) {
            devBox.style.display = 'block';
            devLink.href = data.dev_reset_url;
            devLink.textContent = data.dev_reset_url;
          }
        } catch (error) {
          msg.style.color = '#ef4444';
          msg.innerHTML = '<i class="bi bi-x-circle-fill me-1"></i>Erreur reseau';
        } finally {
          btn.disabled = false;
          btn.textContent = 'Envoyer le lien';
        }
      }
    </script>
</body>
</html>
