<!DOCTYPE html>
<html lang="fr" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connexion - Finova</title>
    <link rel="icon" type="image/png" sizes="32x32" href="assets/img/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="assets/img/favicon-16x16.png">
    <link rel="icon" type="image/png" sizes="192x192" href="assets/img/favicon-192x192.png">
    <link rel="apple-touch-icon" sizes="180x180" href="assets/img/apple-touch-icon.png">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="css/page-bg.css" rel="stylesheet">
    <link href="css/app-ux.css" rel="stylesheet">
    <link href="css/charts-global-theme.css" rel="stylesheet">
    <link href="css/topbar-shell.css" rel="stylesheet">
    <style>
    body { display: flex; align-items: center; justify-content: center; width: 100%; height: 100vh; min-height: 100vh; margin: 0; }
    .auth-card { width: 100%; max-width: 420px; padding: 1rem 2.5rem 2.5rem; text-align: center; }
    
    /* On réduit la hauteur du conteneur du logo */
    .brand-logo { 
        margin-bottom: -10px; /* Marge négative pour remonter le texte */
        padding: 0; 
    }
    
    /* On ajuste l'image pour qu'elle ne crée pas de vide inutile */
    .brand-logo img { 
        width: 300px; /* Réduit un peu pour l'équilibre visuel */
        height: auto;  /* Laisse la hauteur s'adapter naturellement */
        max-height: 200px;
        object-fit: contain; 
        display: block; 
        margin: 0 auto; 
    }

    /* On supprime la marge haute par défaut du titre */
    .auth-card h2 { 
        margin-top: 0 !important; 
        padding-top: 0;
    }

    /* Styles Inputs & Thème Dark */
    input.form-control { border-radius: 12px; padding: 12px 16px; background: rgba(255,255,255,0.05); border: 1.5px solid var(--border); }
    [data-theme='dark'] input.form-control { background: rgba(0,0,0,0.2); color: white; }
    [data-theme='dark'] .auth-card,
    [data-theme='dark'] .auth-card h2,
    [data-theme='dark'] .auth-card .form-label,
    [data-theme='dark'] .auth-card .text-muted,
    [data-theme='dark'] .auth-card .btn {
        color: #fff !important;
    }
</style>
</head>
<body class="auth-page">
    <div style="position: fixed; top: 20px; right: 20px; z-index: 1000;">
        <button class="theme-toggle" id="themeToggle" type="button">
            <span id="themeIcon"><i class="bi bi-moon-stars-fill"></i></span>
            <span id="themeLabel">Sombre</span>
        </button>
    </div>
    <div class="page-bg"><div class="bg-img"></div><div class="bg-veil"></div><div class="bg-grid"></div></div>

    <div class="auth-card card anim">
        <div class="brand-logo"><img src="assets/img/logo.png" alt="Finova logo"></div>
        <h2 class="fw-800 mb-1">Bon retour sur Finova</h2>
        <p class="text-muted mb-4">Connectez-vous pour accéder à vos analytics Finova</p>

        <form id="loginForm" onsubmit="event.preventDefault(); doLogin();" class="text-start">
            <div class="mb-3">
                <label class="form-label small fw-700">Adresse Email</label>
                <input id="email" type="email" class="form-control" placeholder="nom@exemple.com" required>
            </div>
            <div class="mb-4">
                <label class="form-label small fw-700">Mot de passe</label>
                <div class="input-group">
                    <input id="password" type="password" class="form-control" placeholder="••••••••" required>
                    <button class="btn btn-outline-secondary" type="button" onclick="togglePwd()" style="border-radius:0 12px 12px 0;">
                        <i class="bi bi-eye"></i>
                    </button>
                </div>
                <div class="text-end mt-2">
                    <a href="forgot-password.html" class="small fw-700 text-decoration-none" style="color: var(--primary);">
                        Mot de passe oublié ?
                    </a>
                </div>
            </div>

            <button type="submit" class="btn btn-primary w-100 py-3 mb-3 fw-700" id="loginBtn">Se connecter</button>
            <p id="msg" class="text-center small"></p>
        </form>

        <div class="mt-4 pt-3 border-top">
            <span class="text-muted small">Nouveau ici ?</span>
            <a href="register.html" class="small fw-700 text-decoration-none ms-1" style="color: var(--primary);">Créer un compte</a>
        </div>
    </div>

    <script>
        window.AUTH_STORAGE_MODE = window.AUTH_STORAGE_MODE || 'session';
    </script>
    <script src="js/ui-core.js"></script>
    <script src="js/theme-manager.js"></script>
    <script>
        async function doLogin() {
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;
            const msg = document.getElementById('msg');
            const btn = document.getElementById('loginBtn');
            const escapeHtml = (value) => {
                const div = document.createElement('div');
                div.textContent = value == null ? '' : String(value);
                return div.innerHTML;
            };

            btn.disabled = true;
            btn.innerHTML = '<span class="spinner-border spinner-border-sm"></span> Connexion...';

            try {
                const res = await fetch('/api/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });
                const data = await res.json();

                if (data.error) {
                    msg.style.color = '#ef4444';
                    msg.innerHTML = `<i class="bi bi-x-circle-fill me-1"></i>${escapeHtml(data.error)}`;
                    btn.disabled = false;
                    btn.textContent = 'Se connecter';
                    return;
                }

                const authUser = {
                    ...(data.user || {}),
                    token: data.token || data.user?.token || ''
                };
                if (!authUser.token) {
                    throw new Error('Token JWT manquant');
                }

                if (window.UICore?.saveUser) {
                    window.UICore.saveUser(authUser);
                } else {
                    sessionStorage.setItem('user', JSON.stringify(authUser));
                    localStorage.setItem('user', JSON.stringify(authUser));
                }
                window.location.href = authUser.role === 'admin' ? 'admin.html' : 'dash.html';

            } catch (err) {
                msg.style.color = '#ef4444';
                msg.innerHTML = '<i class="bi bi-x-circle-fill me-1"></i>Erreur réseau';
                btn.disabled = false;
                btn.textContent = 'Se connecter';
            }
        }
        function togglePwd() {
            const i = document.getElementById('password');
            i.type = i.type === 'password' ? 'text' : 'password';
        }
    </script>
</body>
</html>
