<!DOCTYPE html>
<html lang="fr" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reinitialiser le mot de passe - Finova</title>
    <link rel="icon" type="image/png" sizes="32x32" href="assets/img/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="assets/img/favicon-16x16.png">
    <link rel="icon" type="image/png" sizes="192x192" href="assets/img/favicon-192x192.png">
    <link rel="apple-touch-icon" sizes="180x180" href="assets/img/apple-touch-icon.png">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="css/page-bg.css" rel="stylesheet">
    <link href="css/app-ux.css" rel="stylesheet">
    <link href="css/charts-global-theme.css" rel="stylesheet">
    <style>
      body { display: flex; align-items: center; justify-content: center; min-height: 100vh; margin: 0; }
      .auth-card { width: 100%; max-width: 440px; padding: 2rem 2.5rem 2.2rem; text-align: center; }
      input.form-control { border-radius: 12px; padding: 12px 16px; background: rgba(255,255,255,0.05); border: 1.5px solid var(--border); }
      [data-theme='dark'] input.form-control { background: rgba(0,0,0,0.2); color: white; }
      .token-error { display: none; margin-bottom: 14px; }
    </style>
</head>
<body class="auth-page">
    <div style="position: fixed; top: 20px; right: 20px; z-index: 1000;">
        <button class="theme-toggle" id="themeToggle" type="button">
            <span id="themeIcon"><i class="bi bi-moon-stars-fill"></i></span>
            <span id="themeLabel">Sombre</span>
        </button>
    </div>

    <div class="page-bg"><div class="bg-img"></div><div class="bg-veil"></div><div class="bg-grid"></div></div>

    <div class="auth-card card anim">
      <h2 class="fw-800 mb-2">Nouveau mot de passe</h2>
      <p class="text-muted mb-4">Choisissez un nouveau mot de passe (8 caracteres minimum).</p>

      <div id="tokenError" class="alert alert-danger token-error" role="alert">
        Lien invalide. Refaites une demande de reinitialisation.
      </div>

      <form id="resetForm" class="text-start" onsubmit="event.preventDefault(); submitResetPassword();">
          <div id="emailGroup" class="mb-3">
              <label class="form-label small fw-700">Adresse Email</label>
              <input id="email" type="email" class="form-control" placeholder="nom@exemple.com" required>
          </div>
          <div id="currentPasswordGroup" class="mb-3">
              <label class="form-label small fw-700">Mot de passe actuel</label>
              <input id="currentPassword" type="password" class="form-control" placeholder="••••••••" required minlength="8">
          </div>
          <div class="mb-3">
              <label class="form-label small fw-700">Nouveau mot de passe</label>
              <input id="newPassword" type="password" class="form-control" placeholder="8 caracteres minimum" required minlength="8">
          </div>
          <div class="mb-3">
              <label class="form-label small fw-700">Confirmer le mot de passe</label>
              <input id="confirmPassword" type="password" class="form-control" placeholder="Retapez le mot de passe" required minlength="8">
          </div>

          <button id="submitBtn" type="submit" class="btn btn-primary w-100 py-3 fw-700">Mettre a jour le mot de passe</button>
          <p id="msg" class="text-center small mt-3 mb-0"></p>
      </form>

      <div class="mt-4 pt-3 border-top">
          <a href="index.html" class="small fw-700 text-decoration-none" style="color: var(--primary);">Retour a la connexion</a>
      </div>
    </div>

    <script src="js/theme-manager.js"></script>
    <script>
      const token = new URLSearchParams(window.location.search).get('token') || '';

      function escapeHtml(value) {
        const div = document.createElement('div');
        div.textContent = value == null ? '' : String(value);
        return div.innerHTML;
      }

      function updateFormState() {
        const emailGroup = document.getElementById('emailGroup');
        const currentPasswordGroup = document.getElementById('currentPasswordGroup');
        const tokenError = document.getElementById('tokenError');
        if (!token) {
          emailGroup.style.display = 'block';
          currentPasswordGroup.style.display = 'block';
          tokenError.style.display = 'none';
        } else {
          emailGroup.style.display = 'none';
          currentPasswordGroup.style.display = 'none';
        }
      }

      updateFormState();

      async function submitResetPassword() {
        const msg = document.getElementById('msg');
        const btn = document.getElementById('submitBtn');
        const email = document.getElementById('email')?.value.trim();
        const currentPassword = document.getElementById('currentPassword')?.value || '';
        const newPassword = document.getElementById('newPassword').value;
        const confirmPassword = document.getElementById('confirmPassword').value;

        msg.style.color = '';
        msg.textContent = '';

        if (!token && !email) {
          msg.style.color = '#ef4444';
          msg.innerHTML = '<i class="bi bi-x-circle-fill me-1"></i>Adresse email requise pour réinitialiser le mot de passe.';
          return;
        }
        if (!token && !currentPassword) {
          msg.style.color = '#ef4444';
          msg.innerHTML = '<i class="bi bi-x-circle-fill me-1"></i>Le mot de passe actuel est requis.';
          return;
        }

        if (newPassword !== confirmPassword) {
          msg.style.color = '#ef4444';
          msg.innerHTML = '<i class="bi bi-x-circle-fill me-1"></i>Les mots de passe ne correspondent pas';
          return;
        }

        btn.disabled = true;
        btn.innerHTML = '<span class="spinner-border spinner-border-sm"></span> Mise a jour...';

        const payload = { new_password: newPassword };
        if (token) {
          payload.token = token;
        } else {
          payload.email = email;
          payload.current_password = currentPassword;
        }

        try {
          const res = await fetch('/api/auth/reset-password', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
          });
          const data = await res.json();

          if (!res.ok) {
            msg.style.color = '#ef4444';
            msg.innerHTML = `<i class="bi bi-x-circle-fill me-1"></i>${escapeHtml(data.error || 'Erreur serveur')}`;
            return;
          }

          msg.style.color = '#10b981';
          msg.innerHTML = `<i class="bi bi-check-circle-fill me-1"></i>${escapeHtml(data.message || 'Mot de passe mis a jour')}. Redirection...`;
          setTimeout(() => { window.location.href = 'index.html'; }, 1600);
        } catch (error) {
          msg.style.color = '#ef4444';
          msg.innerHTML = '<i class="bi bi-x-circle-fill me-1"></i>Erreur reseau';
        } finally {
          btn.disabled = false;
          btn.textContent = 'Mettre a jour le mot de passe';
        }
      }
    </script>
</body>
</html>
