<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Confirmation du changement de mot de passe</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f3f4f6;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
    }
    .card {
      background: #fff;
      padding: 32px;
      border-radius: 12px;
      box-shadow: 0 10px 30px rgba(0,0,0,.08);
      max-width: 520px;
      width: 100%;
      text-align: center;
    }
    .title { font-size: 22px; font-weight: 700; margin-bottom: 12px; }
    .msg { color: #374151; line-height: 1.6; }
    .ok { color: #16a34a; }
    .err { color: #dc2626; }
    .link {
      display: inline-block;
      margin-top: 20px;
      text-decoration: none;
      color: white;
      background: #0ea5e9;
      padding: 12px 18px;
      border-radius: 8px;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="title">Confirmation du changement</div>
    <p class="msg" id="msg">Vérification en cours...</p>
    <a href="index.html" class="link">Retour à la connexion</a>
  </div>

  <script>
    async function run() {
      const params = new URLSearchParams(window.location.search);
      const token = params.get("token");
      const msg = document.getElementById("msg");

      if (!token) {
        msg.textContent = "Lien invalide.";
        msg.className = "msg err";
        return;
      }

      try {
        const res = await fetch("/api/profile/pending/confirm", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ token })
        });

        const data = await res.json();

        if (!res.ok || data.error) {
          msg.textContent = data.error || "Échec de confirmation.";
          msg.className = "msg err";
          return;
        }

        msg.textContent = "Votre nouveau mot de passe a été confirmé avec succès.";
        msg.className = "msg ok";
      } catch (e) {
        msg.textContent = "Erreur serveur.";
        msg.className = "msg err";
      }
    }

    run();
  </script>
</body>
</html>
